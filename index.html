<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker - Spreadsheet</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📊 Habit Tracker</h1>
            <div class="month-selector">
                <button id="prevMonth" class="month-btn">←</button>
                <span id="monthYear" class="month-display"></span>
                <button id="nextMonth" class="month-btn">→</button>
            </div>
        </header>

        <!-- Main Spreadsheet -->
        <div class="spreadsheet-wrapper">
            <div class="table-container">
                <table class="habits-table">
                    <thead>
                        <tr>
                            <th class="habit-name-col">Habit</th>
                            <th class="goal-col">Goal</th>
                            <th id="daysHeader"></th>
                            <th class="percentage-col">%</th>
                        </tr>
                    </thead>
                    <tbody id="habitsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Month Completion</span>
                <span class="stat-value" id="monthCompletion">0%</span>
            </div>
            <div class="stat">
                <span class="stat-label">Days Tracked</span>
                <span class="stat-value" id="daysTracked">0/31</span>
            </div>
            <div class="stat">
                <span class="stat-label">Current Streak</span>
                <span class="stat-value" id="currentStreak">0</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" id="addHabitBtn">+ Add Habit</button>
            <button class="btn btn-secondary" id="exportBtn">📥 Export Data</button>
        </div>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="chart-container">
                <h3>Monthly Trend</h3>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Top Habits</h3>
                <canvas id="topHabitsChart"></canvas>
            </div>
        </section>

        <!-- Top Habits Ranking -->
        <section class="top-habits-section">
            <h2>Top 10 Daily Habits</h2>
            <div id="topHabitsList" class="top-habits-list"></div>
        </section>
    </div>

    <!-- Add Habit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Habit</h2>
            <form id="habitForm">
                <input 
                    type="text" 
                    id="habitName" 
                    placeholder="Habit name"
                    required
                >
                <input 
                    type="text" 
                    id="habitEmoji" 
                    placeholder="Emoji (e.g., 💪)"
                    maxlength="2"
                >
                <input 
                    type="number" 
                    id="habitGoal" 
                    placeholder="Daily goal"
                    min="1"
                    value="1"
                >
                <button type="submit" class="btn btn-primary">Create</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
